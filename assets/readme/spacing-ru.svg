<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Почему описания в магазине больше не налезают</title>
  <desc id="d">Предметы в магазине стоят через 80 игровых пикселей. Английский мод рисует описание шириной 170 пикселей справа от предмета, и блоки накрывают соседей. Этот мод ставит под каждым предметом блок шириной 75 пикселей по центру, и между ними остаётся зазор.</desc>
