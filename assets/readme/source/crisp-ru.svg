<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" role="img" aria-labelledby="t d">
  <title id="t">Одно и то же название в масштабе 100 % и 75 % на экране Switch Lite</title>
  <desc id="d">Пиксели экрана под увеличением. В масштабе 100 % один пиксель шрифта занимает 2,67 пикселя экрана, и штрихи выходят то по 2, то по 3 пикселя. В масштабе 75 % ровно 2 × 2 пикселя, и все штрихи одинаковые.</desc>
  <rect width="1200" height="404" rx="22" fill="#17120F"/>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
  <rect x="56" y="78" width="6" height="52" rx="3" fill="#DA3A40"/>
  <text x="80" y="119" font-size="44" font-weight="800" fill="#F3EEE7">100 %</text>
  <image href="data:image/png;base64," x="250" y="40" width="824" height="128" style="image-rendering:pixelated;image-rendering:crisp-edges"/>
  <text x="250" y="204" font-size="22" fill="#BCB0A5">1 пиксель шрифта = 2,67 пикселя экрана: штрихи то по 2, то по 3 пикселя</text>
  <rect x="56" y="272" width="6" height="52" rx="3" fill="#3CC8C8"/>
  <text x="80" y="313" font-size="44" font-weight="800" fill="#F3EEE7">75 %</text>
  <image href="data:image/png;base64," x="250" y="250" width="616" height="96" style="image-rendering:pixelated;image-rendering:crisp-edges"/>
  <text x="250" y="382" font-size="22" fill="#BCB0A5">1 пиксель шрифта = ровно 2 × 2 пикселя экрана: все штрихи одинаковые</text>
  </g>
</svg>
